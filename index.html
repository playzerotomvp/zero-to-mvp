const MOMENT_QUEUE_STATUSES = ['PENDING','DISPLAYING','COMPLETED','SKIPPED'];
function initCareerMomentsData(g){
  if(!g||typeof g!=='object')return g;
  if(!Array.isArray(g.moments))g.moments=[];
  if(!g.momentFlags||typeof g.momentFlags!=='object'||Array.isArray(g.momentFlags))g.momentFlags={};
  if(!Array.isArray(g.momentQueue))g.momentQueue=[];
  if(!Number.isFinite(g.momentVersion)||g.momentVersion<1)g.momentVersion=1;

  // 기존 하이라이트를 기준으로 일회성 플래그를 복구한다.
  for(const m of g.moments){
    if(!m||typeof m!=='object'||!m.momentId||!m.eventId)continue;
    const flag=g.momentFlags[m.momentId];
    if(flag&&typeof flag==='object'){
      flag.completed=true;
      if(!flag.eventId)flag.eventId=m.eventId;
    }
  }

  const knownIds=new Set(g.moments.filter(m=>m&&m.eventId).map(m=>m.eventId));
  const seenQueue=new Set();
  g.momentQueue=g.momentQueue.filter(q=>q&&typeof q==='object'&&knownIds.has(q.eventId)&&!seenQueue.has(q.eventId)&&seenQueue.add(q.eventId));
  for(const q of g.momentQueue){
    if(!MOMENT_QUEUE_STATUSES.includes(q.status))q.status='PENDING';
    if(!Number.isFinite(q.priority))q.priority=50;
    if(!Number.isFinite(q.createdAt))q.createdAt=Date.now();
    if(q.status==='DISPLAYING')q.status='PENDING'; // 비정상 종료 후 다시 표시 가능하도록 복구
    if(q.status==='COMPLETED'||q.status==='SKIPPED'){
      q.displayedAt=q.displayedAt||q.createdAt;
      q.completedAt=q.completedAt||q.displayedAt;
    }
    const linkedMoment=g.moments.find(m=>m&&m.eventId===q.eventId);
    if(linkedMoment)linkedMoment.status=q.status;
  }
  // 기록은 있지만 대기열 등록이 누락된 이벤트는 안전하게 다시 대기시킨다.
  for(const m of g.moments){
    if(!m||!m.eventId||seenQueue.has(m.eventId))continue;
    const status=MOMENT_QUEUE_STATUSES.includes(m.status)?m.status:'PENDING';
    g.momentQueue.push({eventId:m.eventId,priority:Number.isFinite(m.priority)?m.priority:50,status:status==='DISPLAYING'?'PENDING':status,createdAt:Number.isFinite(m.createdAt)?m.createdAt:Date.now(),displayedAt:m.displayedAt||null,completedAt:m.completedAt||null});
    seenQueue.add(m.eventId);
  }
  return g;
}

}

function careerTotals(filter='all'){
  const seasons=(G?.hist||[]).filter(h=>filter==='all'||h.lv===filter);
  const logged=(G?.seasons||[]).filter(se=>filter==='all'||se.league===filter);
  const loggedIds=new Set(logged.map(se=>se.seasonId));
  const legacy=seasons.filter(h=>!h.seasonId||!loggedIds.has(h.seasonId));
  const games=logged.reduce((n,se)=>n+aggregateSeason(se.games||[]).gp,0)+legacy.reduce((n,h)=>n+(Number(h.gp)||0),0);
  const points=logged.reduce((n,se)=>n+aggregateSeason(se.games||[]).points,0)+legacy.reduce((n,h)=>n+(Number(h.ppg)||0)*(Number(h.gp)||0),0);
  const rebounds=logged.reduce((n,se)=>n+aggregateSeason(se.games||[]).rebounds,0)+legacy.reduce((n,h)=>n+(Number(h.rpg)||0)*(Number(h.gp)||0),0);
  const assists=logged.reduce((n,se)=>n+aggregateSeason(se.games||[]).assists,0)+legacy.reduce((n,h)=>n+(Number(h.apg)||0)*(Number(h.gp)||0),0);
  return {seasons,games,points,rebounds,assists,
    ppg:games?points/games:0,rpg:games?rebounds/games:0,apg:games?assists/games:0};
}

function getMajorAwards(){
  const awards=G?.aw||{};

  const rows=[];
  for(const name of preferred){const count=Number(awards[name])||0;if(count>0)rows.push({name,count});}

 :rookie?['첫 시즌부터 이 정도면 앞으로가 더 기대된다.','신인상 축하! 비시즌에 더 성장해서 돌아오자.','가능성 충분히 보여줬다. 꾸준히 경험 쌓아보자.','새로운 무대에서 잘 적응한 것 같아 보기 좋았다.','처음부터 완벽할 필요는 없어. 성장하는 모습 계속 보여줘!','다음 시즌에는 더 많은 출전 시간 받을 수 있겠다.','데뷔 시즌 고생 많았다. 앞으로가 진짜 시작이다.','몇 경기에서는 깜짝 놀랄 정도였어. 더 성장하자!','우리 팀의 미래가 되어줘!']

 :['잘한 경기도 있었으니 자신감 잃지 말자. 다음 시즌엔 더 잘할 수 있어.','기복만 줄이면 훨씬 좋은 선수가 될 것 같다.','한 시즌 고생했다. 비시즌 잘 준비해서 돌아오자.','아쉬운 순간도 있었지만 응원은 계속할게.','자신 있는 플레이를 더 많이 보여줬으면 좋겠다.','다음 시즌에는 한층 달라진 모습 기대한다.','좋은 경기의 감각을 꾸준히 이어가 보자!','아직 성장할 여지가 많아 보여. 계속 도전하자.','팀에서 어떤 역할을 맡게 될지 다음 시즌이 기대된다.'];
 const seed=String(l.seasonId||`${l.age}-${l.lv}-${l.yr}-${l.ppg}-${l.rpg}-${l.apg}`);

  {source:pick(['팬 반응','팬 커뮤니티','경기장 관중','팬 게시판','서포터즈 반응'],3),quote:pick(fanPools,4)}
 ];

function seasonReportMarkup(l){
 const cur=ovr(),prevO=l.o??cur,delta=cur-prevO,stats=[['득점',l.ppg,'PPG'],['리바운드',l.rpg,'RPG'],['어시스트',l.apg,'APG'],['출전 경기',l.gp,'GP'],['평균 출전 시간',l.min,'MPG'],['팀 승리',l.w,'W']];
 const growth=K.map(k=>{const start=l.startStats?.[k],end=G.s[k],d=Number.isFinite(start)?end-start:0;const change=start==null?'':` (${d>0?'+':''}${d})`;return `<div class="sr-growth-item"><span>${KN[k]}</span><b class="${d>0?'up':d<0?'down':''}">${start==null?end:`${start} → ${end}`}<span class="${d>0?'up':d<0?'down':'same'}">${change}</span></b></div>`}).join('');
 const comps=seasonCompetitionRows(l).map(x=>`<div class="sr-competition"><div class="sr-icon">${x.icon}</div><div class="sr-comp-main"><b>${x.title}</b><small>${x.sub}</small></div><div class="sr-comp-result ${x.tone||''}">${x.result}</div></div>`).join('');
 const reactions=seasonReactions(l).map((x,i)=>i<2?`<div class="sr-reaction"><div class="sr-source">${i===0?'📰':'🎙️'} ${x.source}</div><div class="sr-quote">${x.quote}</div></div>`:`<div class="sr-fan"><div class="sr-avatar">팬</div><div><p>${x.quote}</p><small>${x.source} · 방금 전</small></div></div>`).join('');
 const awards=l.aw.length?l.aw.map(x=>`<span class="sr-award">🏅 ${esc(x)}</span>`).join(''):'<span style="font-size:13px;color:#7b8796">이번 시즌 수상 기록 없음</span>';
 return `<section class="season-report" aria-label="시즌 종료 리포트"><header class="sr-head"><div class="sr-kicker">Season Review · ${l.age}세</div><h2>${esc(G.name||'선수')}의 시즌 결산</h2><div class="sr-sub">${esc(l.lv==='MIL'?militaryName(l.reg??G?.reg):(LV[l.lv]||{n:l.lv}).n)} · ${esc(l.tn)} · ${l.gp}/${l.g}경기 출전${l.lv==='NBA'&&l.nbaRole?` · NBA ${l.nbaCareerSeason}년 차 · ${esc(l.nbaRole)}`:''}</div><div class="sr-ovr"><div class="sr-ovr-num">${cur}</div><div class="sr-ovr-label"><b>종합 능력치</b>${delta>0?`지난 시즌 기준 대비 +${delta} OVR`:delta<0?`지난 시즌 기준 대비 ${delta} OVR`:'현재 종합 능력치'}<br><span style="font-size:11px">※ 능력치 변화는 시즌 종료 시점 기준</span></div></div></header><div class="sr-body"><section class="sr-section"><h3>📊 시즌 기록</h3><div class="sr-stats">${stats.map(x=>`<div class="sr-stat"><strong>${typeof x[1]==='number'?Number(x[1]).toFixed(x[2]==='PPG'||x[2]==='RPG'||x[2]==='APG'?1:0):x[1]}</strong><span>${x[0]}</span></div>`).join('')}</div></section><section class="sr-section"><h3>🏆 대회 결과</h3>${comps}</section><section class="sr-section"><h3>📈 능력치 변화</h3><div class="sr-growth">${growth}</div></section><section class="sr-section"><h3>🏅 개인 수상</h3><div class="sr-awards">${awards}</div></section><section class="sr-section"><h3>🗞️ 언론 · 팬 반응</h3>${reactions}</section></div></section>`;
}


function gameLogPanel(){
 const season=(G?.seasons||[]).slice().reverse().find(x=>x&&Array.isArray(x.games)&&x.games.length);
 if(!season)return `<div class="card"><b>경기별 기록</b><p class="subtle">새 시즌을 진행하면 경기별 박스스코어가 여기에 저장됩니다.</p></div>`;
 const rows=season.games.map(game=>{
  const st=game.stats||{};
  const score=`${game.teamScore} : ${game.opponentScore}`;
  const result=game.result==='W'?'승':'패';
  return `<article class="game-log-row"><div class="game-log-top"><span class="game-result ${game.result==='W'?'win':'loss'}">${result}</span><b>${esc(game.opponent||'상대팀')}</b><span class="game-score">${score}</span></div><div class="game-log-sub">${game.homeAway==='home'?'홈':'원정'} · ${game.gameNumber}번째 경기 · ${st.minutes||0}분 출전</div><div class="game-box-grid"><div><b>${st.points||0}</b><small>득점</small></div><div><b>${st.rebounds||0}</b><small>리바운드</small></div><div><b>${st.assists||0}</b><small>어시스트</small></div><div><b>${st.fgMade||0}/${st.fgAttempted||0}</b><small>FG</small></div><div><b>${st.threeMade||0}/${st.threeAttempted||0}</b><small>3P</small></div><div><b>${st.ftMade||0}/${st.ftAttempted||0}</b><small>FT</small></div><div><b>${st.steals||0}</b><small>스틸</small></div><div><b>${st.blocks||0}</b><small>블록</small></div><div><b>${st.turnovers||0}</b><small>턴오버</small></div></div></article>`;
 }).join('');
 const totals=aggregateSeason(season.games);
 return `<details class="game-log-card"><summary><span>경기별 기록</span><b>${season.games.length}경기 · ${totals.w}승 ${totals.l}패</b></summary><p class="subtle">${season.year}시즌 · ${season.league==='MIL'?militaryName(season.reg):(LV[season.league]||{n:season.league}).n} · ${esc(season.team)}</p><div class="game-log-list">${rows}</div></details>`;
}

else if(G.phase==='end'){

h=`<div class="game-headline">ZERO TO <span>MVP</span> · CAREER ENDED</div>
<section class="hof-card" aria-label="명예의 전당 커리어 결산 카드">

${table()}${b('새 선수로 다시 시작','','clr();G=null;C.cs=[];render()','go')}`}

if(G.phase!=='end'&&G.phase!=='path'&&G.phase!=='turn'&&G.phase!=='hub'&&G.phase!=='out'&&G.phase!=='season'&&G.phase!=='result'){G.phase='hub';return render()}
