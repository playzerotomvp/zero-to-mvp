  if((Number(awards['NBA 올해의 수비수'])||0)>0 || (Number(awards['ALL-DEFENSIVE FIRST TEAM'])||0)>=3)return '코트의 수호자';
  if((Number(awards['NBA 우승'])||0)>=3)return '왕조의 심장';
  if((Number(awards['NBA 올스타'])||Number(awards['올스타'])||0)>0)return '올스타 플레이어';
  if((Number(awards['ALL-NBA FIRST TEAM'])||0)>0)return '퍼스트 팀 스타';
  if(nba.games>0)return 'NBA 무대를 밟은 사나이';
  if((G.hist||[]).some(h=>h.lv==='KBL'))return 'KBL의 자부심';
  if((G.hist||[]).some(h=>h.lv==='NCAA'||h.lv==='UNIV'))return '코트를 거친 승부사';
  return '끝까지 달린 도전자';
}
function getMajorAwards(){
  const awards=G?.aw||{};
  const preferred=['NBA MVP','파이널 MVP','NBA 파이널 MVP','NBA 우승','NBA 올스타','ALL-NBA FIRST TEAM','ALL-NBA SECOND TEAM','ALL-NBA THIRD TEAM','NBA 올해의 수비수','NBA 신인왕','KBL MVP','KBL 베스트5','KBL 수비 5걸'];
  const rows=[];
  for(const name of preferred){const count=Number(awards[name])||0;if(count>0)rows.push({name,count});}
  if(!rows.length){for(const [name,count0] of Object.entries(awards)){const count=Number(count0)||0;if(count>0)rows.push({name,count});}}
  return rows.sort((a,b)=>b.count-a.count).slice(0,8);
}
function buildCareerSummary(){
  const nba=careerTotals('NBA'),awards=getMajorAwards(),nickname=getPlayerNickname();
  const awardText=awards.length?awards.map(a=>`${a.name}${a.count>1?` ${a.count}회`:''}`).join(', '):'주요 수상 없음';
  const pos=POS[G.pos]?.n||G.pos||'미정';
  return [
    '🏀 ZERO TO MVP | CAREER SUMMARY',
    `선수: ${G.name||'이름 없음'}`,
    `등번호 / 포지션: #${G.no??'—'} · ${pos}`,
    `커리어 칭호: ${nickname}`,
    `최고 OVR: ${Number(G.maxO)||0}`,
    '',

    `득점: ${Math.round(nba.points).toLocaleString('ko-KR')}점 (평균 ${nba.ppg.toFixed(1)}점)`,

    `어시스트: ${Math.round(nba.assists).toLocaleString('ko-KR')}개 (평균 ${nba.apg.toFixed(1)}개)`,
    '',
    '【주요 수상】',
    awardText,
    `총 자산: ${Number(G.money||0).toFixed(1)}억`,

  ].join('\n');
}
async function copyCareerSummary(){
  if(!G){alert('복사할 커리어 기록이 없습니다.');return;}
  const text=buildCareerSummary();
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    }else{
      const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');
      area.style.position='fixed';area.style.opacity='0';area.style.pointerEvents='none';document.body.appendChild(area);area.select();
      const ok=document.execCommand('copy');area.remove();if(!ok)throw new Error('clipboard unavailable');
    }
    alert('커리어 요약이 클립보드에 복사되었습니다!');
  }catch(err){
    console.error('커리어 요약 복사 실패:',err);
    alert('클립보드 복사에 실패했습니다. 브라우저 권한을 확인해 주세요.');
  }
}

function saveManager(){

function seasonCompetitionRows(l){
 const name=(LV[l.lv]||{n:l.lv||'리그'}).n,winPct=(Number(l.w)||0)/Math.max(1,Number(l.g)||1),inj=l.inj==='십자인대 파열, 시즌 아웃';

 if(l.lv==='HS'){
  rows.push({icon:'🏟️',title:'고교 리그 정규시즌',sub:`${l.g}경기 기준`,result:inj?'부상으로 이탈':winPct>=.65?'상위권 성적':winPct>=.45?'중위권 성적':'하위권 성적',tone:winPct>=.65?'good':''});

  rows.push({icon:'🏆',title:'대학 플레이오프',sub:'팀 성적 기반 평가',result:l.aw.includes('대학 우승')?'우승':winPct>=.5?'플레이오프 경쟁':'진출 실패',tone:l.aw.includes('대학 우승')?'good':'bad'});

  rows.push({icon:'🏆',title:'플레이오프',sub:'시즌 성적 기반 시뮬레이션',result:l.aw.some(a=>a.includes('우승'))?'챔피언':winPct>=.5?'포스트시즌 도전 종료':'진출 실패',tone:l.aw.some(a=>a.includes('우승'))?'good':'bad'});
 }else rows.push({icon:'🪖',title:'상무 복무 시즌',sub:'개인 기록 및 훈련 제한 반영',result:'시즌 완료',tone:''});
 return rows;

function seasonReactions(l){

else{
